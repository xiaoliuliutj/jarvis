<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ── 自定义标题栏 ─────────────────────────────────────────── -->
  <div id="titlebar">
    <div id="titlebar-left">
      <span id="app-icon">✦</span>
      <span id="app-title">Jarvis</span>
    </div>
    <div id="titlebar-right">
      <button id="btn-settings" title="设置">⚙</button>
      <button id="btn-minimize" title="最小化">─</button>
      <button id="btn-close"    title="关闭">✕</button>
    </div>
  </div>

  <!-- ── 主体（两栏布局：侧边栏 + 对话区） ──────────────────── -->
  <div id="main">

    <!-- 左侧：会话列表 -->
    <div id="session-sidebar">
      <button id="btn-new-session" class="btn-new-session">＋ 新建会话</button>
      <div id="session-list"></div>
    </div>

    <!-- 中间：对话区 + 工作目录管理 -->
    <div id="chat-column">
      <!-- 工作目录管理栏 -->
      <div id="workdir-bar" class="hidden">
        <div id="workdir-label">工作目录：</div>
        <div id="workdir-list"></div>
        <button id="btn-add-workdir" title="添加工作目录">＋ 添加目录</button>
      </div>

      <!-- 对话区 -->
      <div id="chat-area">
        <div id="messages"></div>
        <div id="input-row">
          <div id="readonly-hint" style="display:none"></div>
          <textarea
            id="input"
            placeholder="输入消息，Shift+Enter 换行，Enter 发送…"
            rows="1"
            autofocus
          ></textarea>
          <button id="btn-send">发送</button>
        </div>
      </div>
    </div>

  </div><!-- #main -->

  <!-- ── 设置 overlay（点齿轮展开） ──────────────────────────── -->
  <div id="settings-panel" class="hidden">
    <div class="settings-section">
      <div class="settings-label">当前模型</div>
      <div id="current-model-display" class="current-model clickable" title="点击编辑配置文件">—</div>
    </div>

    <div class="settings-section">
      <div class="settings-label">权限模式</div>
      <select id="select-permission"></select>
    </div>

    <div class="settings-section" id="agent-selector-section" style="display:none">
      <!-- 仅当有多个 Agent 时显示 -->
    </div>

    <div class="settings-section">
      <div class="settings-label">记忆事件</div>
      <div id="memory-log" class="memory-log"></div>
    </div>

    <div id="usage-info"></div>
  </div>

  <!-- ── 配置文件编辑弹窗 ─────────────────────────────────────── -->
  <div id="config-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">编辑配置文件</span>
        <span id="modal-path" class="modal-path"></span>
        <button id="modal-close" class="modal-close">✕</button>
      </div>
      <textarea id="config-editor" class="config-editor" spellcheck="false"></textarea>
      <div class="modal-footer">
        <span id="modal-error" class="modal-error"></span>
        <button id="modal-cancel" class="modal-btn-cancel">取消</button>
        <button id="modal-save"   class="modal-btn-save">保存</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
