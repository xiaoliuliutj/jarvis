<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#123b2f" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.png" />
  <link rel="stylesheet" href="/style.css?v=3" />
  <title>Jarvis</title>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <span class="dot" id="statusDot"></span>
        <span class="title">Jarvis</span>
        <span class="status-text" id="statusText">连接中…</span>
      </div>
      <span class="header-tag">管理台</span>
    </header>

    <main id="main">
      <section id="view-chat" class="view">
        <div id="messages" aria-live="polite"></div>
        <footer id="composer">
          <button id="attachBtn" class="icon-btn" aria-label="附件">📎</button>
          <input type="file" id="fileInput" multiple hidden />
          <div id="attachPreview" class="attach-preview"></div>
          <textarea id="input" rows="1" placeholder="和 Jarvis 说点什么喵～"></textarea>
          <button id="sendBtn" class="send-btn" aria-label="发送">发送</button>
        </footer>
      </section>

      <section id="view-history" class="view hidden">
        <div class="page-head">
          <h2>历史消息</h2>
          <button id="historyRefresh" class="ghost-btn">刷新</button>
        </div>
        <div id="historyList" class="history-list"></div>
      </section>

      <section id="view-settings" class="view hidden">
        <div class="page-head">
          <h2>设置</h2>
        </div>
        <div class="settings-card">
          <div class="settings-row">
            <span>连接状态</span>
            <span id="settingsStatus">—</span>
          </div>
          <div class="settings-row">
            <span>服务器</span>
            <span id="settingsUrl">—</span>
          </div>
          <div class="settings-row">
            <span>设备标识</span>
            <span id="settingsDevice">—</span>
          </div>
          <div class="settings-row">
            <span>访问令牌</span>
            <span id="settingsToken">—</span>
          </div>
        </div>
        <div class="settings-actions">
          <button id="editConnection" class="primary-btn">修改连接</button>
          <button id="reconnectBtn" class="ghost-btn wide">重新连接</button>
          <button id="clearLocalBtn" class="danger-btn">清空本地聊天记录</button>
        </div>
        <p class="settings-hint">用量统计、配置管理、任务卡和审批会在后续版本接入。</p>
      </section>
    </main>

    <nav id="bottomNav">
      <button class="nav-btn active" data-tab="chat">聊天</button>
      <button class="nav-btn" data-tab="history">历史</button>
      <button class="nav-btn" data-tab="settings">设置</button>
    </nav>
  </div>

  <div id="setup" class="setup hidden">
    <div class="setup-card">
      <h1>连接 Jarvis</h1>
      <p class="hint">在电脑上启动 Bridge（App adapter）后，填入访问地址和令牌。</p>
      <label>服务器地址
        <input id="setupUrl" type="url" placeholder="http://192.168.x.x:17779" />
      </label>
      <label>访问令牌
        <input id="setupToken" type="password" placeholder="userdata/app-adapter/token.txt" />
      </label>
      <label>设备标识
        <input id="setupDevice" type="text" placeholder="owner" />
      </label>
      <button id="setupSave" class="primary-btn">保存并连接</button>
      <p class="hint" id="setupError"></p>
    </div>
  </div>

  <script src="/app.js?v=3"></script>
</body>
</html>
